apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvault-frontend
  namespace: kvault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kvault-frontend
  template:
    metadata:
      labels:
        app: kvault-frontend
    spec:
      containers:
        - name: frontend
          image: kvault-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---

apiVersion: v1
kind: Service
metadata:
  name: kvault-frontend
  namespace: kvault
spec:
  type: NodePort
  selector:
    app: kvault-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080


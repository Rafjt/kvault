apiVersion: v1
kind: ConfigMap
metadata:
  name: kvault-db-init
  namespace: kvault
data:
  init.sql: |
    CREATE TABLE users (
        id INT AUTO_INCREMENT PRIMARY KEY,
        login VARCHAR(255) NOT NULL UNIQUE,
        hashed_master_password VARCHAR(255) NOT NULL,

        -- Sel pour la dérivation de clé (KDF)
        kdf_salt VARBINARY(64) NOT NULL,

        -- Master key chiffrée avec la KEK
        encrypted_master_key VARBINARY(255) NOT NULL,

        -- Clé publique utilisée pour les groupes stockée en claire
        rsa_public_key BLOB NOT NULL,

        -- Clé privé utilisée pour les groupes stockée chifrée via la Master key
        encrypted_rsa_private_key BLOB NOT NULL,

        -- Statut de vérification
        is_verified BOOLEAN NOT NULL DEFAULT FALSE,

        -- Token de vérification email
        verification_token CHAR(64),

        -- Expiration du token (email reset / verify)
        token_expiry TIMESTAMP NULL,

        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    ) ENGINE=InnoDB;

    CREATE TABLE organizations (

        id INT AUTO_INCREMENT PRIMARY KEY,

        name VARCHAR(255) NOT NULL,

        created_by INT NOT NULL,

        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,

        FOREIGN KEY(created_by)
            REFERENCES users(id)
            ON DELETE CASCADE
    );

    CREATE TABLE org_members (

        organization_id INT NOT NULL,

        user_id INT NOT NULL,

        role ENUM(
            'owner',
            'admin',
            'member'
        ) DEFAULT 'member',

        protected_osk VARBINARY(1024) NOT NULL,

        joined_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,

        PRIMARY KEY(
            organization_id,
            user_id
        ),

        CONSTRAINT fk_org_member_org
            FOREIGN KEY (organization_id)
            REFERENCES organizations(id)
            ON DELETE CASCADE,

        CONSTRAINT fk_org_member_user
            FOREIGN KEY (user_id)
            REFERENCES users(id)
            ON DELETE CASCADE
    );

    CREATE TABLE organization_secrets (
        id INT AUTO_INCREMENT PRIMARY KEY,

        organization_id INT NOT NULL,

        type VARCHAR(50) NOT NULL,

        name VARCHAR(200) NOT NULL,

        encrypted_cipher_key VARBINARY(512) NOT NULL,

        ciphertext VARBINARY(4096) NOT NULL,

        nonce VARBINARY(32) NOT NULL,

        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,

        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            ON UPDATE CURRENT_TIMESTAMP,

        CONSTRAINT fk_org_secret_org
            FOREIGN KEY (organization_id)
            REFERENCES organizations(id)
            ON DELETE CASCADE
    );

    CREATE TABLE secrets (
        id INT AUTO_INCREMENT PRIMARY KEY,
        owner_id INT NOT NULL,

        type VARCHAR(50) NOT NULL,
        name VARCHAR(200) NOT NULL,

        ciphertext VARBINARY(4096) NOT NULL,
        nonce VARBINARY(32) NOT NULL,

        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            ON UPDATE CURRENT_TIMESTAMP,

        CONSTRAINT fk_secrets_owner
            FOREIGN KEY (owner_id)
            REFERENCES users(id)
            ON DELETE CASCADE
    ) ENGINE=InnoDB;

    CREATE TABLE auth_tokens (
        id INT AUTO_INCREMENT PRIMARY KEY,
        user_id INT NOT NULL,

        token_hash VARBINARY(32) NOT NULL,
        expires_at TIMESTAMP NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,

        CONSTRAINT fk_tokens_user
            FOREIGN KEY (user_id)
            REFERENCES users(id)
            ON DELETE CASCADE
    ) ENGINE=InnoDB;

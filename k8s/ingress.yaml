apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kvault-ingress
  namespace: kvault
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - kvault.local
      secretName: kvault-tls

  rules:
    - host: kvault.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kvault-frontend
                port:
                  number: 80

          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: kvault-backend
                port:
                  number: 2111

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kvault-backend
                port:
                  number: 2111


apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvault-db
  namespace: kvault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kvault-db
  template:
    metadata:
      labels:
        app: kvault-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kvault-db-secrets
                  key: root-password
            - name: MYSQL_DATABASE
              value: kvault
            - name: MYSQL_USER
              value: kvault
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kvault-db-secrets
                  key: user-password
          ports:
            - containerPort: 3306

---

apiVersion: v1
kind: Service
metadata:
  name: kvault-db
  namespace: kvault
spec:
  selector:
    app: kvault-db
  ports:
    - port: 3306
      targetPort: 3306
